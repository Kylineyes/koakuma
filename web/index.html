<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>koakuma 流量监控</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>koakuma 流量监控</h1>
      <p class="subtitle">OpenWrt 路由器分设备流量实时监控</p>
    </header>

    <section class="card controls">
      <div class="device-picker">
        <div class="device-picker-head">
          <span class="field-label">选择设备</span>
          <span class="selected-count" id="selected-count">已选 0 台</span>
          <span class="device-picker-actions">
            <button id="select-all-btn" type="button" class="btn btn-mini btn-secondary">全选</button>
            <button id="clear-all-btn" type="button" class="btn btn-mini btn-secondary">清空</button>
          </span>
        </div>
        <div class="device-chips" id="device-chips" role="group" aria-label="设备多选"></div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="cards">
      <div class="card metric">
        <div class="metric-head">
          <span class="metric-title" id="rx-title">下载速率</span>
          <span class="metric-tag rx">RX</span>
        </div>
        <div class="metric-value" id="rx-value">—</div>
      </div>
      <div class="card metric">
        <div class="metric-head">
          <span class="metric-title" id="tx-title">上传速率</span>
          <span class="metric-tag tx">TX</span>
        </div>
        <div class="metric-value" id="tx-value">—</div>
      </div>
    </section>

    <section class="card history">
      <div class="history-head">
        <h2>历史流量曲线</h2>
        <div class="history-tools">
          <label class="field">
            <span class="field-label">显示方式</span>
            <select id="mode-select" class="select select-narrow">
              <option value="separate">分开查看</option>
              <option value="overlay">叠加查看</option>
            </select>
          </label>
          <label class="field" id="metric-field" hidden>
            <span class="field-label">指标</span>
            <select id="metric-select" class="select select-narrow">
              <option value="both">下载+上传</option>
              <option value="rx">下载</option>
              <option value="tx">上传</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">时间范围</span>
            <select id="range-select" class="select"></select>
          </label>
          <span class="tools-sep">或自定义时间段</span>
          <label class="field">
            <span class="field-label">从</span>
            <input id="from-input" type="datetime-local" class="datetime">
          </label>
          <label class="field">
            <span class="field-label">至</span>
            <input id="to-input" type="datetime-local" class="datetime">
          </label>
          <button id="apply-btn" type="button" class="btn">查看</button>
          <button id="refresh-btn" type="button" class="btn btn-secondary">刷新</button>
          <button id="reset-btn" type="button" class="btn btn-secondary">重置</button>
        </div>
      </div>
      <div class="charts-container" id="charts-container"></div>
      <p class="hint" id="chart-hint"></p>
    </section>
  </div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
