[package]
name = "koakuma"
version = "0.3.3"
edition = "2021"
description = "面向 OpenWrt 的分设备网络流量采集守护进程"
license = "MIT"

[dependencies]
# SQLite 本地数据库，静态编入二进制
rusqlite = { version = "0.43", features = ["bundled"] }
# ubus 返回为 JSON，用 serde 解析
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 轻量 HTTP 服务（内置 Web 页面与查询接口）
tiny_http = "0.12"
# 时间处理
libc = "0.2"

[profile.release]
opt-level = "z"      # 体积优先，适合嵌入式
lto = true
codegen-units = 1
strip = true
panic = "abort"
